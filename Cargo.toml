[package]
name = "niux"
version = "26.6.0"
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive", "string"] }
dirs = "6.0.0"
tempfile = "3.27.0"
libc = "0.2.186"
colored = "3.1.1"
shell-words = "1.1.0"
anyhow = "1.0.102"
pretty_env_logger = "0.5.0"
log = "0.4.29"
miette = { version = "7.6", features = ["fancy"] }
miette5 = { package = "miette", version = "5.10", features = ["fancy"] }
git-version = "0.3.9"
serde_json = "1.0.151"
niux-migrate = { path = "niux-migrate" }
knuffel = "3.2.0"
serde-kdl2 = "0.1.0"
kdl = "6.7.1"
serde = "1.0.229"

[[bin]]
name = "niux"
path = "src/main.rs"

[[bin]]
name = "niux-writer"
path = "src/bin/niux_writer.rs"
