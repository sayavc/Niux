[package]
name = "niux"
version = "26.6.0"
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
knuffel = { git = "https://github.com/sayavc/knuffel" }
tempfile = "3.27.0"
colored = "3.1.1"
shell-words = "1.1.0"
pretty_env_logger = "0.5.0"
git-version = "0.3.9"
serde_json = "1.0.151"
niux-macros = { path = "niux-macros" }
regex = "1.13.1"
miette.workspace = true
thiserror.workspace = true
log.workspace = true
clap.workspace = true

[workspace]
resolver = "3"
members = [
    "niux-macros",
    "niux-writer"
]
default-members = [
    ".",
    "niux-writer"
]

[workspace.dependencies]
log = "0.4.29"
miette = { version = "7.6.0", features = ["fancy"] }
clap = { version = "4.6.0", features = ["derive", "string"] }
thiserror = "2.0.20"
